name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily, 3am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install fonttools brotli pillow

      - name: Refresh contribution stats
        env:
          GH_USERNAME: vrbeirer
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_stats.py

      - name: Render cards
        run: python generate_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json cards/
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
